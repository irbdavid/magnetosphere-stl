[project]
name = "magnetosphere-stl"
version = "0.1.0"
description = "Generate 3D-printable component meshes of Earth's magnetosphere"
readme = "README.md"
requires-python = ">=3.13"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.GPL"]
dependencies = [
    "geopack",
    "manifold3d>=3.5.2",
    "numpy>=2.5.2",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "trimesh>=5.0.0",
]

[project.scripts]
magnetosphere-stl = "magnetosphere_stl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.uv.sources]
geopack = { git = "https://github.com/tsssss/geopack.git" }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
